name: Bug report
description: Something in Take does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Record panel
        2. ...
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Part of the app
      options: [Microphone, Camera, Record, Teleprompter, Export, Install or launch, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Take version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 on Apple Silicon / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Microphone, camera, screens
      description: Models if you know them, and how many monitors.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything from the developer console (View, Toggle Developer Tools) helps.
